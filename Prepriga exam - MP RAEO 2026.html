<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E1218">
<title>Prepriga Exam Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Devanagari:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-indic:"Noto Sans Devanagari","Nirmala UI","Kohinoor Devanagari","Devanagari Sangam MN",
    "Noto Sans Bengali","Bangla Sangam MN","Noto Sans Tamil","Tamil Sangam MN",
    "Noto Sans Telugu","Telugu Sangam MN","Noto Sans Kannada","Kannada Sangam MN",
    "Noto Sans Malayalam","Malayalam Sangam MN","Noto Sans Gujarati","Gujarati Sangam MN",
    "Noto Sans Gurmukhi","Gurmukhi MN","Noto Sans Oriya","Oriya Sangam MN",
    "Noto Nastaliq Urdu","Noto Sans Arabic";
  --f-doc:var(--f-ui),var(--f-indic);
  --f-math:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;

  --red:#E2373F; --orange:#EF8B23; --yellow:#EFC521; --slate:#6C7787;
  --teal:#2F9E8F; --indigo:#5468C4; --purple:#7A4FD1;

  /* CBT palette — the codes candidates actually learn */
  --st-na:#D8443C;      /* not answered   */
  --st-ans:#2E9E63;     /* answered       */
  --st-nv:#B9C1CB;      /* not visited    */
  --st-mark:#7A4FD1;    /* marked         */
  --st-both:#7A4FD1;    /* answered+marked*/

  --ink:#12171D; --ink2:#3A444F; --ink3:#6B7684;
  --line:#E2E7EC; --line2:#CFD6DE; --bg:#EEF1F5; --card:#FFFFFF; --soft:#F7F9FB;
  --grad:linear-gradient(90deg,var(--red) 0 24%,var(--orange) 24% 48%,var(--yellow) 48% 72%,var(--slate) 72%);
  --hd:64px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-doc);font-size:15px;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--f-mono)}
.hide{display:none!important}

/* ---------- shared chrome ---------- */
.bar{height:4px;background:var(--grad)}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 48px}
.eyebrow{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
h1.big{font-weight:800;letter-spacing:-.03em;font-size:clamp(26px,7vw,38px);line-height:1.05;margin:8px 0 8px}
h1.big i{color:var(--red);font-style:normal}
.lede{color:var(--ink2);line-height:1.55;margin:0 0 22px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.field input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:13px}
.field .err{color:var(--red);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--red);color:#fff;border:0;border-radius:11px;padding:15px 18px;
  font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink)}
.btn.green{background:var(--st-ans)} .btn.wa{background:#25D366;color:#06301B}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{width:auto;flex:1 1 auto;min-width:130px}
.seg{display:flex;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:8px;padding:10px 6px;color:var(--ink3);
  font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.note{font-size:12.5px;color:var(--ink3);line-height:1.55}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px 16px;text-align:center;background:#fff}
.drop.hot{border-color:var(--orange);background:#FFF8F0}
.tile{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px;cursor:pointer}
.tile b{display:block;font-size:14.5px}.tile small{display:block;color:var(--ink3);font-size:11.5px;
  margin-top:2px;font-family:var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.tile .gl{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:700;background:#EEF1F5}
.tile .ch{margin-left:auto;color:var(--ink3);font-size:19px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;background:var(--ink);
  color:#fff;padding:11px 17px;border-radius:11px;font-size:13.5px;max-width:88vw;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- exam chrome ---------- */
.exam{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.xhd{flex:none;background:#fff;border-bottom:1px solid var(--line2)}
.xhd .r1{display:flex;align-items:center;gap:12px;padding:9px 14px}
.xhd .nm{font-weight:800;letter-spacing:-.02em;font-size:15px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xhd .sub{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.xhd .sp{flex:1}
.clock{font-family:var(--f-mono);font-weight:700;font-size:17px;letter-spacing:.04em;
  background:var(--ink);color:#fff;border-radius:9px;padding:7px 11px;flex:none;font-variant-numeric:tabular-nums}
.clock.warn{background:var(--orange)} .clock.crit{background:var(--st-na);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.6}}
.clock small{display:block;font-size:7.5px;letter-spacing:.18em;opacity:.75;font-weight:500}
.lang{border:1px solid var(--line2);border-radius:9px;background:#fff;padding:7px 9px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;font-weight:700;cursor:pointer;flex:none}
.secs{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.secs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 15px;
  font-size:12.5px;font-weight:650;color:var(--ink3);cursor:pointer;white-space:nowrap}
.secs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--red)}

.xbody{flex:1;display:flex;min-height:0}
.qpane{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 8px}
.qtop{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 16px;position:sticky;top:0;z-index:5}
.qtop .qn{font-weight:750;font-size:14.5px}
.qtop .mk{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;display:flex;gap:7px}
.qtop .mk .p{color:var(--st-ans)} .qtop .mk .n{color:var(--st-na)}
.qbox{background:#fff;margin:0;padding:18px 16px 22px;min-height:100%}
.stem{font-size:16px;line-height:1.62;margin-bottom:18px}
.stem .hi{display:block;margin-top:9px;color:var(--ink2)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opts li{border:1.5px solid var(--line2);border-radius:12px;background:#fff}
.opts label{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts .lt{flex:none;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line2);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink3)}
.opts .tx{flex:1;line-height:1.55;font-size:15px}
.opts .tx .hi{display:block;margin-top:5px;color:var(--ink2);font-size:14.2px}
.opts li.sel{border-color:var(--indigo);background:#F4F6FE}
.opts li.sel .lt{background:var(--indigo);border-color:var(--indigo);color:#fff}
.opts li.ok{border-color:var(--st-ans);background:#F2FBF6}
.opts li.ok .lt{background:var(--st-ans);border-color:var(--st-ans);color:#fff}
.opts li.bad{border-color:var(--st-na);background:#FEF4F3}
.opts li.bad .lt{background:var(--st-na);border-color:var(--st-na);color:#fff}

.xnav{flex:none;background:#fff;border-top:1px solid var(--line2);padding:9px 12px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;align-items:center}
.xnav button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:11px 12px;
  font-size:12.5px;font-weight:650;cursor:pointer;flex:none}
.xnav .next{background:var(--st-ans);border-color:var(--st-ans);color:#fff;margin-left:auto;flex:1;max-width:210px}
.xnav .mark{color:var(--st-mark);border-color:#D9CCF2}
.xnav .pal{display:none}
.xnav .prev{flex:none;font-family:var(--f-mono);font-weight:700}

/* palette */
.pal{flex:none;width:268px;background:#fff;border-left:1px solid var(--line2);
  display:flex;flex-direction:column;min-height:0}
.pal .ph{padding:11px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.legend div{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink2)}
.legend i{width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;color:#fff;font-style:normal;font-family:var(--f-mono)}
.grid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;align-content:start}
.grid button{aspect-ratio:1;border:0;border-radius:7px;font-family:var(--f-mono);font-size:12px;
  font-weight:700;cursor:pointer;color:#fff;background:var(--st-nv);position:relative}
.grid button.nv{background:#EDF0F4;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line2)}
.grid button.na{background:var(--st-na)}
.grid button.ans{background:var(--st-ans)}
.grid button.mark{background:var(--st-mark)}
.grid button.both{background:var(--st-mark)}
.grid button.both::after{content:"";position:absolute;right:2px;bottom:2px;width:9px;height:9px;
  border-radius:50%;background:var(--st-ans);box-shadow:0 0 0 1.5px #fff}
.grid button.cur{outline:2.5px solid var(--ink);outline-offset:1.5px}
.pal .pf{border-top:1px solid var(--line);padding:11px 14px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(12,18,24,.55);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;
  max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .hnd{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:9px auto 3px}

@media (max-width:860px){
  .pal{display:none}
  .xnav{display:grid;grid-template-columns:46px 1fr 1fr 1fr;gap:6px}
  .xnav .pal{display:inline-flex}
  .xnav button{padding:12px 6px;font-size:12.5px;min-width:0}
  .xnav .next{grid-column:1/-1;max-width:none;margin:0;padding:14px}
}

/* ---------- result & review ---------- */
.score{background:var(--ink);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.score .v{font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1}
.score .v span{font-size:20px;color:#8B97A6;font-weight:600}
.score .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8B97A6;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.stats div{background:#fff;padding:12px}
.stats .v{font-weight:800;font-size:20px;letter-spacing:-.02em}
.stats .l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.bar2{height:7px;border-radius:4px;background:#EDF0F4;overflow:hidden;display:flex}
.bar2 i{display:block;height:100%}
.rev{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px}
.rev .rh{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.rev .rn{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.1em}
.rev .tag{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  border-radius:20px;padding:3px 8px;font-weight:700;margin-left:auto}
.tag.ok{background:#E8F7EF;color:#1E7A4C} .tag.bad{background:#FDECEA;color:#B3271F}
.tag.skip{background:#EEF1F5;color:var(--ink3)}
.sol dl{display:grid;grid-template-columns:112px 1fr;gap:9px 13px;margin:12px 0 0;
  border-top:1px solid var(--line);padding-top:11px}
.sol dt{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;line-height:1.5}
.sol dd{margin:0;font-size:13.8px;line-height:1.55}
.sol dd p{margin:0 0 7px}.sol dd p:last-child{margin:0}
.sol dt.trap{color:var(--red)}
@media (max-width:600px){.sol dl{grid-template-columns:1fr;gap:3px 0}
  .sol dt{margin-top:9px}.sol dd{margin-bottom:4px}}
.filters{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:20px;
  padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink3)}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
table.d{width:100%;border-collapse:collapse;font-size:13px}
table.d th{text-align:left;font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);padding:8px 9px;border-bottom:1px solid var(--line2)}
table.d td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.d tr:last-child td{border-bottom:0}
.mth{font-family:var(--f-math);font-style:italic}
.mth .op,.mth .dg{font-style:normal}
.mth .fr{display:inline-block;vertical-align:-.55em;text-align:center;margin:0 .18em}
.mth .fr>span{display:block;padding:0 .3em}
.mth .fr>span:first-child{border-bottom:1px solid currentColor}
.mth sup,.mth sub{font-size:.7em;font-style:normal}
code.inl{font-family:var(--f-mono);font-size:.86em;background:#F1F4F7;border-radius:4px;padding:1px 5px}
.hi{font-family:var(--f-indic),var(--f-ui)}
/* the second language always begins on its own line, wherever it appears */
.hi2{display:block;margin-top:8px;color:var(--ink2)}
.opts .hi2{margin-top:5px;font-size:.96em}
.sol dd .hi2,.rev .hi2{margin-top:5px}
@media print{body{background:#fff}.exam,.xnav,.pal,.sheet{display:none!important}}
</style>
</head>
<body>

<div id="app"><div class="bar"></div><div id="main" class="wrap"></div></div>

<div class="exam hide" id="exam">
  <div class="bar"></div>
  <header class="xhd">
    <div class="r1">
      <div style="min-width:0">
        <div class="nm" id="xName">Exam</div>
        <div class="sub" id="xWho">Candidate</div>
      </div>
      <div class="sp"></div>
      <button class="lang" id="xLang">EN+हि</button>
      <div class="clock" id="xClock">--:--:--<small>TIME LEFT</small></div>
    </div>
    <div class="secs" id="xSecs"></div>
  </header>
  <div class="xbody">
    <div class="qpane" id="xPane"></div>
    <aside class="pal" id="xPal"></aside>
  </div>
  <nav class="xnav" id="xNav"></nav>
</div>

<div class="sheet" id="sheet"><div class="in">
  <div class="hnd"></div><div id="sheetIn" style="overflow-y:auto"></div>
</div></div>

<input type="file" id="fPick" accept=".md,.markdown,.txt,text/markdown" hidden="">

<script type="text/plain" id="pub0"># MP RAEO 2026 / मध्य प्रदेश ग्रामीण कृषि विस्तार अधिकारी 2026
## Full-Length High-Probability Mock Test / पूर्ण-लंबाई हाई-प्रोबेबिलिटी मॉक टेस्ट

**Language / भाषा:** Bilingual / द्विभाषी  
**Paper / प्रश्नपत्र:** Group-2 Sub-Group-1 Agriculture Extension Officer Recruitment Test 2026 / समूह-2 उप-समूह-1 कृषि विस्तार अधिकारी भर्ती परीक्षा 2026  
**Questions / प्रश्न:** 200  
**Maximum Marks / अधिकतम अंक:** 200  
**Duration / अवधि:** 180 minutes / 180 मिनट  
**Negative Marking / ऋणात्मक अंकन:** +1 correct, −0.25 wrong / सही +1, गलत −0.25

> **Mock status / मॉक स्थिति:** Original, evidence-grounded mock reconstructed to match the verified 2026 structure and syllabus; not an official paper and no question is guaranteed.
> **मॉक स्थिति:** सत्यापित 2026 structure और syllabus के अनुरूप तैयार किया गया मौलिक mock; यह official paper नहीं है और किसी प्रश्न की guarantee नहीं है।

## SECTION 1 — EXAM INSTRUCTIONS / खंड 1 — परीक्षा निर्देश

1. **One paper / एक प्रश्नपत्र:** 200 marks, with Part A 100 marks and Part B 100 marks. / 200 अंक, जिसमें Part A 100 और Part B 100 अंक है।
2. **Objective MCQs / वस्तुनिष्ठ MCQs:** Four options and one best answer. / चार विकल्प और एक सर्वोत्तम उत्तर।
3. **Time / समय:** 180 minutes. / 180 मिनट।
4. **Marking / अंकन:** +1 for correct and −0.25 for wrong. / सही के लिए +1 और गलत के लिए −0.25।
5. **Part A / भाग A:** General Knowledge, Hindi, English, Mathematics, Reasoning, Science and Computer. / सामान्य ज्ञान, हिन्दी, अंग्रेजी, गणित, तर्क, विज्ञान और कम्प्यूटर।
6. **Part B / भाग B:** Agriculture-related syllabus. / कृषि-संबंधित पाठ्यक्रम।
7. **Do not check the key before finishing. / पूरा paper हल करने से पहले answer key न देखें।**

## SECTION 2 — THE MOCK TEST / खंड 2 — मॉक टेस्ट

### PART A — GENERAL SUBJECTS / भाग A — सामान्य विषय

### Q1. The constitutional head of a State is: / राज्य का संवैधानिक प्रमुख है:

A. Governor / राज्यपाल
B. Chief Minister / मुख्यमंत्री
C. Speaker / अध्यक्ष
D. Chief Secretary / मुख्य सचिव

### Q2. The 73rd Amendment relates to: / 73वाँ संशोधन संबंधित है:

A. Panchayati Raj / पंचायती राज
B. Municipalities / नगरपालिकाएँ
C. Fundamental Duties / मौलिक कर्तव्य
D. Emergency / आपातकाल

### Q3. The Tropic of Cancer crosses how many Indian states? / कर्क रेखा कितने भारतीय राज्यों से गुजरती है?

A. 6 / 6
B. 7 / 7
C. 8 / 8
D. 9 / 9

### Q4. The 'Sorrow of Bihar' is: / 'बिहार का शोक' है:

A. Ganga / गंगा
B. Kosi / कोसी

"use strict";

const NONLAT=/[\u0900-\u0DFF\u0600-\u06FF\u0590-\u05FF\u0E00-\u0E7F\u4E00-\u9FFF\u3040-\u30FF\uAC00-\uD7AF]/;

/* "English / हिंदी" — split only on a true language boundary */
function biSplit(text){
  const t=String(text);
  if(!NONLAT.test(t)) return null;
  const re=/\s+[\/|]\s+/g; let m;
  while((m=re.exec(t))){
    const a=t.slice(0,m.index), b=t.slice(m.index+m[0].length);
    if(!NONLAT.test(a)&&NONLAT.test(b)&&a.trim().length>1&&b.trim().length>1)
      return {en:a.trim(),hi:b.trim()};

}

function bi(text,tag){

  return inl(b.en)+'<span class="hi '+(tag||"hi2")+'">'+inl(b.hi)+"</span>";
}
const biPlain=t=>{const b=biSplit(t); return b?(LANG==="hi"?b.hi:b.en):t;};

/* --- compact maths, enough for exam stems --------------------------- */
const GREEK={alpha:"α",beta:"β",gamma:"γ",delta:"δ",Delta:"Δ",theta:"θ",lambda:"λ",mu:"μ",
  pi:"π",rho:"ρ",sigma:"σ",Sigma:"Σ",tau:"τ",phi:"φ",omega:"ω",Omega:"Ω",eta:"η",epsilon:"ε"};
const MOPS={times:"×",div:"÷",pm:"±",cdot:"·",leq:"≤",le:"≤",geq:"≥",ge:"≥",neq:"≠",ne:"≠",
  approx:"≈",equiv:"≡",propto:"∝",infty:"∞",sum:"∑",prod:"∏",int:"∫",partial:"∂",
  rightarrow:"→",to:"→",Rightarrow:"⇒",degree:"°",angle:"∠",therefore:"∴",in:"∈",
  cup:"∪",cap:"∩",sqrt:"√",rupee:"₹",percent:"%"};
function brace(s,i){ if(s[i]!=="{")return[s[i]||"",i+1];
  let d=0,j=i; for(;j<s.length;j++){if(s[j]==="{")d++;else if(s[j]==="}"){d--;if(!d)break;}}
  return [s.slice(i+1,j),j+1]; }
function math(s){
  let out="",i=0;
  while(i<s.length){
    const c=s[i];
    if(c==="\\"){
      const m=/^\\([A-Za-z]+)/.exec(s.slice(i));
      if(m){ const cmd=m[1]; i+=m[0].length;
        if(cmd==="frac"||cmd==="dfrac"){let a,b;[a,i]=brace(s,i);[b,i]=brace(s,i);
          out+='<span class="fr"><span>'+math(a)+'</span><span>'+math(b)+'</span></span>';continue;}
        if(cmd==="sqrt"){let a;[a,i]=brace(s,i);out+='<span class="op">√</span><u>'+math(a)+"</u>";continue;}
        if(cmd==="text"||cmd==="mathrm"){let a;[a,i]=brace(s,i);out+='<span class="op">'+esc(a)+"</span>";continue;}
        out+='<span class="op">'+(GREEK[cmd]||MOPS[cmd]||esc(cmd))+"</span>";continue;}
      out+=esc(s[i+1]||"");i+=2;continue;
    }
    if(c==="^"||c==="_"){let a;[a,i]=brace(s,i+1);
      out+=(c==="^"?"<sup>":"<sub>")+math(a)+(c==="^"?"</sup>":"</sub>");continue;}
    if(/[0-9.,()+\-=<>\/|]/.test(c)){out+='<span class="dg">'+esc(c)+"</span>";i++;continue;}
    out+=esc(c);i++;
  }
  return out;
}
function inl(raw){
  let s=esc(String(raw).replace(/\\([\\`*_{}\[\]()#+\-.!|~<>$])/g,"$1"));
  s=s.replace(/(^|[^-])---(?!-)/g,"$1—");
  const keep=[]; const st=h=>{keep.push(h);return "\u0000"+(keep.length-1)+"\u0000";};
  s=s.replace(/`([^`]+)`/g,(m,c)=>st('<code class="inl">'+c+"</code>"));
  s=s.replace(/\$\$?([^$]+)\$\$?/g,(m,c)=>st('<span class="mth">'+math(c.replace(/&amp;/g,"&"))+"</span>"));
  s=s.replace(/\*\*\*([^*]+)\*\*\*/g,"<strong><em>$1</em></strong>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,"$1<em>$2</em>");
  s=s.replace(/\^\{([^}]*)\}/g,"<sup>$1</sup>").replace(/_\{([^}]*)\}/g,"<sub>$1</sub>");
  s=s.replace(/(^|\s)-&gt;(\s|$)/g,"$1→$2");
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>keep[+i]);
  return s;
}

/* --- structural scanning -------------------------------------------- */
const OPT=/^\s*(?:\*\*|__)?\s*\(?([A-Ea-e])[.):\]]\s*(?:\*\*|__)?\s+(.+)$/;
const QH=/^\s*(?:Q(?:uestion)?|प्रश्न|प्रश्‍न)\s*\.?\s*(\d{1,3})\b[.):\-\u2014\u00B7]?\s*(.*)$/i;
const SECH=/^\s*(?:SECTION|PART|भाग|खंड)\s+([A-Z0-9IVX]+)\b\s*[-\u2013\u2014:.]*\s*(.*)$/i;
const num=s=>{const m=/(\d[\d,]*\.?\d*)/.exec(String(s)); return m?parseFloat(m[1].replace(/,/g,"")):null;};

function splitOptions(text){
  const re=/(?:^|\n|\s)(?:\*\*|__)?\(?([A-Ea-e])[.):\]](?:\*\*|__)?\s+/g;
  const seq=[]; let m;
  while((m=re.exec(text))){
    const L=m[1].toUpperCase();
    if(L==="ABCDE"[seq.length]) seq.push({s:m.index,e:re.lastIndex});
  }
  if(seq.length<2) return null;
  const opts=[];
  for(let i=0;i<seq.length;i++){
    const to=i+1<seq.length?seq[i+1].s:text.length;
    opts.push(text.slice(seq[i].e,to).replace(/\s+/g," ").trim());
  }
  return {opts,pre:text.slice(0,seq[0].s).trim()};
}

function parsePaper(src){
  const raw=String(src).replace(/\r\n?/g,"\n").replace(/[\uE000-\uF8FF]/g,"")
    .replace(/(?:file)?cite\w*turn\d+\w*/g,"");
  const L=raw.split("\n");
  const meta={}, questions=[], byN={}, keyRows=[];
  let title="", instructions=[], revision=[], perf=[];
  let zone="head", curSec=null, curQ=null, curSol=null, curField=null, buf=[];

  const flushQ=()=>{
    if(!curQ) return;
    const body=buf.join("\n").trim();
    const o=splitOptions(body);
    if(o){ curQ.stem=(curQ.stem+"\n"+o.pre).trim(); curQ.opts=o.opts; }
    else curQ.stem=(curQ.stem+"\n"+body).trim();
    buf=[]; curQ=null;
  };
  const push=(t)=>{ if(t.trim()) buf.push(t); };
  const addField=(k,v)=>{ if(!curSol) return;
    curSol.f[k]=(curSol.f[k]?curSol.f[k]+"\n":"")+v; };

  for(let i=0;i<L.length;i++){
    let line=L[i];
    const h=/^(#{1,6})\s+(.*)$/.exec(line);

    if(h){
      const lvl=h[1].length;
      let t=h[2].trim().replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").trim();
      const n=norm(t);
      // "SECTION 2 --- THE MOCK TEST" and "THE MOCK TEST" are the same marker
      const n2=n.replace(/^SECTION\s+\d+\s*[-\u2013\u2014:.]*\s*/,"").trim();
      const qm=QH.exec(t);

      if(lvl===1&&!title&&!qm&&!/^(ANSWER KEY|DETAILED SOLUTION|SOLUTION|SECTION|LAST)/.test(n2)){
        title=t; zone="head"; continue;
      }
      if(qm){
        const qn=+qm[1];
        if(zone==="sol"||(zone!=="test"&&byN[qn])){
          flushQ();
          curSol=byN[qn]||(byN[qn]={n:qn,stem:"",opts:[],sec:null,f:{},title:""});
          if(questions.indexOf(curSol)<0) questions.push(curSol);
          curSol.f=curSol.f||{}; curSol.title=qm[2]||curSol.title; curField=null; zone="sol";
          continue;
        }
        flushQ();
        curQ=byN[qn]||{n:qn,stem:"",opts:[],sec:curSec,f:{},title:""};
        curQ.stem=qm[2]||""; curQ.sec=curSec;
        if(!byN[qn]){ byN[qn]=curQ; questions.push(curQ); }
        zone="test"; continue;
      }
      // inside a solution, every sub-heading is one of the ten explanation fields
      if(zone==="sol"&&curSol&&lvl>=2){ curField=n; continue; }

      if(/^ANSWER KEY/.test(n2)){ flushQ(); zone="key"; curSol=null; continue; }
      if(/^(DETAILED SOLUTIONS?|SOLUTIONS?|EXPLANATIONS?)\b/.test(n2)){
        flushQ(); zone="sol"; curSol=null; continue; }
      if(/^(LAST[- ]MINUTE|REVISION SHEET|QUICK REVISION)/.test(n2)){ flushQ(); zone="rev"; continue; }
      if(/^(MOCK PERFORMANCE MAP|PERFORMANCE MAP|BLUEPRINT|COVERAGE)/.test(n2)){ flushQ(); zone="perf"; continue; }
      if(/^(EXAM INSTRUCTIONS?|INSTRUCTIONS?)\b/.test(n2)){ flushQ(); zone="inst"; continue; }
      if(/^(THE MOCK TEST|MOCK TEST|QUESTIONS?|TEST PAPER)\b/.test(n2)){ flushQ(); zone="test"; continue; }

      const sm=SECH.exec(t);
      if(sm&&lvl<=3&&zone!=="sol"&&zone!=="rev"&&zone!=="perf"){
        flushQ();
        curSec=(sm[2]||"").trim()||("Section "+sm[1]);
        curSec=curSec.replace(/^[-\u2013\u2014:.\s]+/,"").trim()||("Section "+sm[1]);
        continue;
      }
      if(zone==="inst"){ instructions.push("**"+t+"**"); continue; }
      if(zone==="rev"){ revision.push("### "+t); continue; }
      if(zone==="perf"){ perf.push("### "+t); continue; }
      continue;
    }

    if(zone==="head"){
      const mm=/^\s*\*\*([^*]+?)\s*:\s*\*\*\s*(.+)$/.exec(line)
            || /^\s*\*\*([^*]+?)\*\*\s*:\s*(.+)$/.exec(line);
      if(mm) meta[norm(mm[1])]=mm[2].trim();
      continue;
    }
    if(zone==="inst"){ instructions.push(line); continue; }
    if(zone==="rev"){ revision.push(line); continue; }
    if(zone==="perf"){ perf.push(line); continue; }
    if(zone==="key"){
      if(/^\s*\|/.test(line)){
        const c=line.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
        if(c.length>=2&&/^\d+$/.test(c[0].replace(/\D/g,""))&&/^[A-Ea-e]$/.test(c[1].replace(/[^A-Ea-e]/g,"")))
          keyRows.push({n:parseInt(c[0].replace(/\D/g,""),10),
            a:c[1].replace(/[^A-Ea-e]/g,"").toUpperCase(),t:c[2]||""});
      }
      continue;
    }
    if(zone==="sol"&&curSol){
      // a field label must carry a colon; a plain bold line is content
      const fm=/^\s*\*\*([^*]{2,70}?)\s*:\s*\*\*\s*(.*)$/.exec(line)
            || /^\s*\*\*([^*]{2,70}?)\*\*\s*:\s*(.*)$/.exec(line);
      if(fm){ curField=norm(fm[1]); addField(curField,fm[2]); continue; }
      if(curField) addField(curField,line);
      continue;
    }
    if(zone==="test"&&curQ) push(line);
  }
  flushQ();

  keyRows.forEach(r=>{ const q=byN[r.n]; if(q){ q.key=r.a; q.keyText=r.t; } });
  questions.forEach(q=>{
    if(!q.key){
      const a=(q.f["CORRECT ANSWER"]||q.f["ANSWER"]||q.f["CORRECT ANSWER सही उत्तर"]||"").trim();
      const m=/^\(?([A-Ea-e])\)?\b/.exec(a.replace(/[*_]/g,""));
      if(m) q.key=m[1].toUpperCase();
    }
    q.ans="ABCDE".indexOf(q.key||"");
  });
  questions.sort((a,b)=>a.n-b.n);

  const g=k=>{ for(const kk of Object.keys(meta)) if(kk.indexOf(k)>=0) return meta[kk]; return ""; };
  const dur=num(g("DURATION"))||0;
  const marksTotal=num(g("MAXIMUM MARKS"))||num(g("MARKS"))||questions.length;
  const negRaw=g("NEGATIVE");
  let neg=0;
  if(negRaw&&!/^\s*(none|nil|no\b|0\b|शून्य)/i.test(negRaw)){
    const fr=/(\d+)\s*\/\s*(\d+)/.exec(negRaw);
    neg=fr?(+fr[1])/(+fr[2]):(num(negRaw)||0);
    if(neg>1) neg=0;
  }
  const per=questions.length?marksTotal/questions.length:1;
  const secs=[...new Set(questions.map(q=>q.sec).filter(Boolean))];

  return {
    title:title||g("PAPER")||"Mock Test",
    meta, instructions:instructions.join("\n").trim(),
    revision:revision.join("\n").trim(), perf:perf.join("\n").trim(),
    questions, sections:secs,
    paper:g("PAPER"), language:g("LANGUAGE"),
    minutes:dur||Math.max(10,Math.round(questions.length*1.2)),
    marks:marksTotal, per, neg,
    negLabel:negRaw||"None"
  };
}

/* ---- publishing: seal the papers into a copy of this file ---------- */
const SEAL_A="<\\/script", SEAL_B="</script";
const unSeal=t=>String(t).split(SEAL_A).join(SEAL_B);
function publish(){
  let html=PRISTINE;
  [0,1].forEach(i=>{
    const safe=String(RAW[i]||"").split(SEAL_B).join(SEAL_A);
    const open='<script type="text/plain" id="pub'+i+'">';
    const a=html.indexOf(open);
    if(a<0) return;
    const b=html.indexOf("</scr"+"ipt>",a+open.length);
    html=html.slice(0,a+open.length)+safe+html.slice(b);
  });
  const t0=S.papers[0]||S.papers[1];
  const name=("Prepriga exam - "+(t0?biPlain(t0.title):"mock"))
    .replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim().slice(0,80)+".html";
  const a=el("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast("Published \u2014 send that file to candidates.");
}

async function loadFile(f){
  const txt=await f.text();
  let p; try{ p=parsePaper(txt); }catch(e){ toast("Could not read that file."); return; }
  if(!p.questions.length){ toast("No questions found in that file."); return; }
  const bad=p.questions.filter(q=>!q.opts.length||q.ans<0).length;
  S.papers[S.slot]=p; RAW[S.slot]=txt;
  await Store.set("paper"+S.slot,txt);
  toast(p.questions.length+" questions loaded"+(bad?" · "+bad+" need checking":""));
  S.view="papers"; draw();
}

/* ---------- the CBT engine ----------------------------------------- */
let T=null;
function startExam(p){
  const secs=p.sections.length?p.sections:[null];
  T={p,i:0,sec:secs[0],secs,
     st:p.questions.map(()=>({v:false,a:-1,m:false,t:0})),
     left:p.minutes*60, t0:Date.now(), last:Date.now()};
  S.view="exam"; draw();
  $("xName").textContent=biPlain(p.title);
  $("xWho").textContent=(S.cand.name?S.cand.name+" · ":"")+
    "Paper "+(S.slot+1)+" · "+p.questions.length+" questions · "+p.marks+" marks";
  buildSecs(); buildPal(); buildNav(); showQ(0);
  clearInterval(T.timer);
  $("xClock").innerHTML=hhmmss(T.left)+"<small>TIME LEFT</small>";
  T.timer=setInterval(tick,1000);
}
function tick(){
  T.left--;
  const c=$("xClock");
  c.innerHTML=hhmmss(Math.max(0,T.left))+"<small>TIME LEFT</small>";
  c.className="clock"+(T.left<=60?" crit":T.left<=300?" warn":"");
  if(T.left<=0){ clearInterval(T.timer); submit(true); }
}
function buildSecs(){
  const s=$("xSecs");
  if(T.secs.length<2||!T.secs[0]){ s.style.display="none"; return; }
  s.style.display=""; s.innerHTML="";
  T.secs.forEach(name=>{
    const b=el("button",null,esc(biPlain(name)));
    b.setAttribute("aria-pressed",String(name===T.sec));
    b.onclick=()=>{ T.sec=name;
      const k=T.p.questions.findIndex(q=>q.sec===name);
      buildSecs(); buildPal(); if(k>=0) showQ(k); };
    s.appendChild(b);
  });
}
const stOf=i=>{const s=T.st[i];
  if(s.a>=0&&s.m) return "both"; if(s.m) return "mark";
  if(s.a>=0) return "ans"; if(s.v) return "na"; return "nv";};
function palHTML(){
  const L=[["ans","Answered"],["na","Not answered"],["nv","Not visited"],
           ["mark","Marked"],["both","Answered &amp; marked"]];
  const counts={ans:0,na:0,nv:0,mark:0,both:0};
  T.st.forEach((_,i)=>counts[stOf(i)]++);
  return '<div class="ph">Question palette</div>'+
    '<div class="legend">'+L.map(([k,t])=>'<div><i class="'+k+'" style="background:'+
      (k==="nv"?"#EDF0F4;color:#6B7684;box-shadow:inset 0 0 0 1px #CFD6DE":
       "var(--st-"+(k==="both"?"mark":k)+")")+'">'+counts[k]+'</i>'+t+"</div>").join("")+"</div>";
}
function buildPal(){
  const host=$("xPal");
  host.innerHTML=palHTML()+'<div class="grid" id="xGrid"></div>'+
    '<div class="pf"><button class="btn" id="xSub">Submit test</button></div>';
  paintGrid($("xGrid"));
  $("xSub").onclick=()=>confirmSubmit();
}
function paintGrid(g){
  g.innerHTML="";
  T.p.questions.forEach((q,i)=>{
    if(T.secs[0]&&q.sec!==T.sec) return;
    const b=el("button",stOf(i)+(i===T.i?" cur":""),String(q.n));
    b.onclick=()=>{ showQ(i); closeSheet(); };
    g.appendChild(b);
  });
}
function repaint(){
  const g=$("xGrid"); if(g){ $("xPal").innerHTML=palHTML()+'<div class="grid" id="xGrid"></div>'+
    '<div class="pf"><button class="btn" id="xSub">Submit test</button></div>';
    paintGrid($("xGrid")); $("xSub").onclick=()=>confirmSubmit(); }
  const sg=$("sGrid"); if(sg) paintGrid(sg);
}
function buildNav(){
  const n=$("xNav");
  n.innerHTML='<button class="prev" id="nPrev" aria-label="Previous">&#8249;</button>'+
    '<button class="pal" id="nPal">Palette</button>'+
    '<button id="nClear">Clear</button>'+
    '<button class="mark" id="nMark">Mark</button>'+
    '<button class="next" id="nNext">Save &amp; next</button>';
  $("nPrev").onclick=()=>go(-1);
  $("nPal").onclick=openSheet;
  $("nClear").onclick=()=>{ T.st[T.i].a=-1; showQ(T.i); };
  $("nMark").onclick=()=>{ T.st[T.i].m=true; go(1); };
  $("nNext").onclick=()=>go(1);
}
function openSheet(){
  $("sheetIn").innerHTML=palHTML()+'<div class="grid" id="sGrid" style="max-height:46vh"></div>'+
    '<div style="padding:12px 14px"><button class="btn" id="sSub">Submit test</button></div>';
  paintGrid($("sGrid"));
  $("sSub").onclick=()=>{closeSheet();confirmSubmit();};
  $("sheet").classList.add("on");
}
function closeSheet(){ $("sheet").classList.remove("on"); }
function go(d){
  const list=T.p.questions.map((q,i)=>i).filter(i=>!T.secs[0]||T.p.questions[i].sec===T.sec);
  const at=list.indexOf(T.i);
  const nx=list[Math.min(list.length-1,Math.max(0,at+d))];
  if(nx===T.i&&d>0) toast("Last question in this section.");
  showQ(nx);
}
function showQ(i){
  const now=Date.now();
  if(T.st[T.i]) T.st[T.i].t+=Math.round((now-T.last)/1000);
  T.last=now;
  T.i=i; T.st[i].v=true;
  const q=T.p.questions[i], p=T.p;
  const pane=$("xPane");
  pane.innerHTML='<div class="qtop"><span class="qn">Question '+q.n+
    ' <span style="color:var(--ink3);font-weight:500">of '+p.questions.length+'</span></span>'+
    '<span class="mk"><span class="p">+'+(Math.round(p.per*100)/100)+'</span>'+
    (p.neg?'<span class="n">−'+(Math.round(p.neg*100)/100)+"</span>":"")+"</span></div>"+
    '<div class="qbox"><div class="stem">'+bi(q.stem)+'</div>'+
    '<ul class="opts" id="xOpts"></ul>'+
    (T.st[i].m?'<div class="note" style="margin-top:14px;color:var(--st-mark)">Marked for review.</div>':"")+
    '</div>';
  const ul=$("xOpts");
  q.opts.forEach((o,k)=>{
    const li=el("li",T.st[i].a===k?"sel":null);
    li.innerHTML='<label><input type="radio" name="o" '+(T.st[i].a===k?"checked":"")+'>'+
      '<span class="lt">'+"ABCDE"[k]+'</span><span class="tx">'+bi(o)+"</span></label>";
    li.onclick=()=>{ T.st[i].a=k; showQ(i); repaint(); };
    ul.appendChild(li);
  });
  if(!q.opts.length) ul.innerHTML='<li style="border-style:dashed"><label><span class="tx" '+
    'style="color:var(--ink3)">This question has no options in the source file.</span></label></li>';
  pane.scrollTop=0;
  repaint();
}
function confirmSubmit(){
  const c={ans:0,na:0,nv:0,mark:0,both:0}; T.st.forEach((_,i)=>c[stOf(i)]++);
  $("sheetIn").innerHTML='<div style="padding:16px 18px 20px">'+
    '<div class="eyebrow">Submit</div>'+
    '<h1 class="big" style="font-size:23px;margin:6px 0 12px">Ready to submit?</h1>'+
    '<div class="stats" style="margin-bottom:14px">'+
      '<div><div class="v">'+(c.ans+c.both)+'</div><div class="l">Answered</div></div>'+
      '<div><div class="v">'+(c.na+c.mark)+'</div><div class="l">Not answered</div></div>'+
      '<div><div class="v">'+c.nv+'</div><div class="l">Not visited</div></div>'+
      '<div><div class="v">'+hhmmss(Math.max(0,T.left))+'</div><div class="l">Time left</div></div>'+
    '</div>'+
    '<div class="row"><button class="btn ghost" id="cCancel">Keep going</button>'+
    '<button class="btn" id="cOk">Submit</button></div></div>';
  $("sheet").classList.add("on");
  $("cCancel").onclick=closeSheet;
  $("cOk").onclick=()=>{closeSheet();submit(false);};
}
function submit(auto){
  clearInterval(T.timer);
  T.st[T.i].t+=Math.round((Date.now()-T.last)/1000);
  const p=T.p;
  let right=0,wrong=0,skip=0,score=0;
  const rows=p.questions.map((q,i)=>{
    const a=T.st[i].a;
    let v="skip";
    if(a<0){ skip++; }
    else if(a===q.ans){ right++; score+=p.per; v="ok"; }
    else { wrong++; score-=p.neg; v="bad"; }
    return {q,a,v,t:T.st[i].t,m:T.st[i].m};
  });
  score=Math.round(score*100)/100;
  const att=right+wrong;
  const res={slot:S.slot,title:biPlain(p.title),paper:S.slot+1,
    score,max:p.marks,right,wrong,skip,att,
    acc:att?Math.round(right/att*1000)/10:0,
    used:p.minutes*60-Math.max(0,T.left),auto:!!auto,
    when:new Date().toISOString(),rows,per:p.per,neg:p.neg,
    secs:p.sections.map(s=>{
      const rs=rows.filter(r=>r.q.sec===s);
      return {name:biPlain(s),n:rs.length,right:rs.filter(x=>x.v==="ok").length,
        wrong:rs.filter(x=>x.v==="bad").length};
    })};
  S.results=S.results||{}; S.results[S.slot]=res; S.res=res;
  Store.set("res"+S.slot,{score,right,wrong,skip,when:res.when,title:res.title});
  S.view="result"; draw();
}

    window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(waText(r)),"_blank","noopener");
  };
  $("cp").onclick=async()=>{
    sync();
    try{ await navigator.clipboard.writeText(waText(r)); toast("Scorecard copied."); }
    catch(e){ toast("Copy failed — use the WhatsApp button."); }
  };
  $("rv").onclick=()=>{S.filter="all";S.view="review";draw();};
  $("hm").onclick=()=>{S.view="papers";draw();};
}

/* ---------- solution review ---------------------------------------- */
const FIELDS=[["EXPLANATION","Explanation"],["CORE CONCEPT","Core concept"],
  ["WHY","Why correct"],["STEP BY STEP REASONING","Reasoning"],["FORMULA","Formula"],
  ["GIVEN","Given"],["CALCULATION","Calculation"],["RESULT","Result"],
  ["WHY THE OTHER OPTIONS ARE WRONG","Others wrong"],["WHY OTHER OPTIONS ARE WRONG","Others wrong"],
  ["COMMON TRAP","Common trap"],["MEMORY HOOK","Memory hook"],
  ["IF YOU SEE THIS","If you see this"],["EXAM TAKEAWAY","Takeaway"],
  ["RELATED HIGH YIELD FACTS","Related facts"],["SOURCE","Source"]];
function mdBlock(txt){
  const out=[]; let list=null;
  String(txt).split("\n").forEach(l=>{
    const t=l.trim();
    if(!t){ if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;} return; }
    const li=/^[-*+]\s+(.*)$/.exec(t)||/^\d+[.)]\s+(.*)$/.exec(t);
    if(li){ (list=list||[]).push("<li>"+bi(li[1])+"</li>"); return; }
    if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;}
    if(/^\|/.test(t)) return;
    if(/^###\s/.test(t)){ out.push("<p><strong>"+bi(t.replace(/^###\s*/,""))+"</strong></p>"); return; }
    out.push("<p>"+bi(t)+"</p>");
  });
  if(list) out.push("<ul>"+list.join("")+"</ul>");
  return out.join("");
}
function solHTML(q){
  const seen={}, dl=[];
  FIELDS.forEach(([k,label])=>{
    const flat=x=>String(x).replace(/[-\u2013\u2014]/g," ").replace(/\s+/g," ");
    const hit=Object.keys(q.f||{}).find(kk=>flat(kk).indexOf(flat(k))>=0&&!seen[kk]);
    if(!hit||seen[label]) return;
    seen[hit]=1; seen[label]=1;
    const body=String(q.f[hit]).trim(); if(!body) return;
    dl.push('<dt'+(/TRAP/.test(k)?' class="trap"':"")+">"+label+"</dt><dd>"+mdBlock(body)+"</dd>");
  });
  return dl.length?'<div class="sol"><dl>'+dl.join("")+"</dl></div>":
    '<div class="note" style="margin-top:10px">No solution text for this question in the source file.</div>';
}
function viewReview(v){
  const r=S.res;
  const shown=r.rows.filter(x=>S.filter==="all"||x.v===S.filter||(S.filter==="mark"&&x.m));
  v.innerHTML='<div class="eyebrow">Paper '+r.paper+' &middot; solutions</div>'+
    '<h1 class="big" style="font-size:clamp(20px,5.4vw,26px)">Review</h1>'+
    '<div class="filters" id="ft">'+
      [["all","All "+r.rows.length],["bad","Wrong "+r.wrong],["skip","Skipped "+r.skip],
       ["ok","Correct "+r.right],["mark","Marked"]].map(([k,t])=>
      '<button data-f="'+k+'" aria-pressed="'+(S.filter===k)+'">'+t+"</button>").join("")+"</div>"+
      '<div class="card" style="padding:10px 14px"><div class="seg" id="rl">'+
      '<button data-l="both" aria-pressed="'+(LANG==="both")+'">Both</button>'+
      '<button data-l="en" aria-pressed="'+(LANG==="en")+'">English</button>'+
      '<button data-l="hi" aria-pressed="'+(LANG==="hi")+'">हिंदी</button></div></div>'+
    shown.map(x=>{
      const q=x.q;
      return '<div class="rev"><div class="rh"><span class="rn">Q'+q.n+'</span>'+
        '<span class="tag '+x.v+'">'+(x.v==="ok"?"Correct":x.v==="bad"?"Wrong":"Skipped")+"</span></div>"+
        '<div style="font-size:14.6px;line-height:1.6;margin-bottom:11px">'+bi(q.stem)+"</div>"+
        '<ul class="opts">'+q.opts.map((o,k)=>{
          const cls=k===q.ans?"ok":(k===x.a?"bad":"");
          return '<li class="'+cls+'"><label><span class="lt">'+"ABCDE"[k]+'</span>'+
            '<span class="tx">'+bi(o)+(k===x.a&&k!==q.ans?' <b style="color:var(--st-na)">— your answer</b>':"")+
            "</span></label></li>";
        }).join("")+"</ul>"+solHTML(q)+"</div>";
    }).join("")+
    (r.rowsRev?"":"")+
    '<button class="btn ghost" id="bk" style="margin-top:6px">Back to result</button>';
  $("ft").onclick=e=>{const b=e.target.closest("[data-f]"); if(b){S.filter=b.dataset.f;draw();}};
  $("rl").onclick=e=>{const b=e.target.closest("[data-l]"); if(b){LANG=b.dataset.l;draw();}};
  $("bk").onclick=()=>{S.view="result";draw();};
}
